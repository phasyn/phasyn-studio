# Phasyn Studio GPU runtime environment — Linux aarch64, sm121 unified-memory (UMA) GPU
# (typical role: the Qwen3-VL text encoder, which needs a large memory pool)
#
# Non-package project: it only pins the immutable environment the H3 components
# (``phasyn_h3``, recipe over pinned SGLang) run in: Python, PyTorch, CUDA userspace,
# cuDNN and the SGLang commit.  It is NOT a member of the
# repo-root uv workspace; lock and install it from this directory.

[project]
name = "phasyn-gpu-runtime-aarch64-sm121"
version = "1.0.0"
license = "Apache-2.0"
description = "Phasyn Studio H3 runtime env: linux aarch64, sm121, torch 2.14.1+cu130, SGLang de487f8"
requires-python = "==3.12.*"
dependencies = [
    # Pinned SGLang source; only the extra the H3 multimodal path imports
    # (`diffusion`: cache_dit, diffusers, av, PyYAML ... are module-level imports
    # of the H3 stage chain).
    "sglang[diffusion]",
    # Exactly the torch pins SGLang de487f8 declares, taken from the PyTorch
    # CUDA 13.0 index (sm120/sm121 need a CUDA >= 12.8 build; SGLang's kernel
    # dependencies are cu13 builds).
    "torch==2.14.1",
    "torchvision==0.29.1",
    "torchaudio==2.11.0",
    # SGLang pins cuda-tile==1.6.0rc5; PyPI only has a wheel-stub sdist that
    # downloads the real wheel at build time.  Taking the hash-pinned wheel from
    # NVIDIA's index keeps the install offline-reproducible.
    "cuda-tile==1.6.0rc5",
    # NF4 (bitsandbytes double-quant) checkpoints; 0.50.2 ships an aarch64 libbitsandbytes_cuda130.so built for
    # sm75;80;90;100;110;120;121 (sm121 included).
    "bitsandbytes==0.50.2",
    # qimg.vision (image captioning) loads Qwen3-VL with device_map, which needs accelerate (same version as qimg-x86_64)
    "accelerate==1.15.0",
    # Phasyn Studio owners (path dependencies; see [tool.uv.sources]).
    "phasyn-components",
    "phasyn-h3",
    "phasyn-captioner",
    "phasyn-qimg",
    "phasyn-media",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
# Pillow decodes the images people upload. moviepy 2.2.1 (an SGLang `diffusion` dependency that nothing on the
# H3 path imports) caps Pillow below 12, and the 11.x and 12.x lines have known memory-safety advisories that
# only 13.0.0 fixes, so the cap is overridden. The pin is exact because Pillow sits in the decode and resize
# path: pinned exactly.
override-dependencies = ["pillow==13.0.0"]

[tool.uv.sources]
sglang = { git = "https://github.com/sgl-project/sglang", rev = "de487f8039e06853b5f376fd5f068ea9d7c400bb", subdirectory = "python" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
cuda-tile = { index = "nvidia" }
# This repo's packages are editable path installs (restart a component process to pick up code changes;
# torch / SGLang stay pinned by this lock).
phasyn-components = { path = "../../../packages/components", editable = true }
phasyn-media = { path = "../../../packages/media", editable = true }
phasyn-h3 = { path = "../../../runtimes/h3", editable = true }
phasyn-captioner = { path = "../../../runtimes/captioner", editable = true }
phasyn-qimg = { path = "../../../runtimes/qimg", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

# SGLang declares a dynamic (setuptools-scm) version and needs torch==2.14.1 +
# setuptools-rust just to build metadata.  This block is generated verbatim from
# the pinned python/pyproject.toml by ../_tools/sglang_dependency_metadata.py
# (verify with its --check mode); the version is the one uv's own metadata
# build of this git source produced.
[[tool.uv.dependency-metadata]]
