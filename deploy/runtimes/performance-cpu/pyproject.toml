# CPU-only pose and facial performance runtime. The Node uses this interpreter per component.
[project]
name = "phasyn-runtime-performance-cpu"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "phasyn-components",
    "phasyn-media",
    "phasyn-captioner",
    "phasyn-performance",
    "mediapipe==1.2.3",
    "numpy==2.5.5",
    "opencv-contrib-python==5.0.0.93",
    "pillow==13.0.0",
]

[tool.uv]
package = false
exclude-newer = "2026-11-17T00:00:00Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
phasyn-components = { path = "../../../packages/components", editable = true }
phasyn-media = { path = "../../../packages/media", editable = true }
phasyn-captioner = { path = "../../../runtimes/captioner", editable = true }
phasyn-performance = { path = "../../../runtimes/performance", editable = true }
