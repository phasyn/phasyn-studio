[project]
name = "phasyn-runtime-segmentation"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "phasyn-segmentation", "phasyn-components", "phasyn-media",
    "torch==2.14.1", "torchvision==0.29.1", "SAM-2", "av==19.0.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
phasyn-segmentation = { path = "../../../runtimes/segmentation" }
phasyn-components = { path = "../../../packages/components" }
phasyn-media = { path = "../../../packages/media" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
SAM-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

[tool.uv.extra-build-dependencies]
sam-2 = [{ requirement = "torch", match-runtime = true }, "setuptools"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
