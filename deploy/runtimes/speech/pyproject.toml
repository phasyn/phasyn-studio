# Offline inference uses the official local checkpoint. This project installs Python packages only.
[project]
name = "phasyn-runtime-speech"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "phasyn-speech", "phasyn-components", "qwen-tts==0.1.1",
    "torch==2.15.0", "torchaudio==2.11.1", "soundfile==0.14.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
phasyn-components = { path = "../../../packages/components" }
phasyn-speech = { path = "../../../runtimes/speech" }
