# Private GPU worker environment. Engine sources and model checkpoints are operator-supplied files.
[project]
name = "phasyn-runtime-wan-native"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "phasyn-wan-native", "phasyn-components", "phasyn-media",
    "torch==2.8.0", "torchvision==0.23.0", "flash-attn",
    "transformers==4.51.3", "tokenizers>=0.21,<0.22", "diffusers==0.35.2",
    "accelerate>=1.1.1", "peft==0.17.1", "safetensors", "easydict",
    "numpy>=1.26,<2", "opencv-python>=4.9,<4.12", "scipy",
    "Pillow", "tqdm", "einops", "ftfy", "sentencepiece", "regex", "librosa",
    "decord", "imageio[ffmpeg]", "imageio-ffmpeg", "moviepy", "loguru",
    "onnxruntime", "matplotlib", "omegaconf", "hydra-core", "SAM-2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
phasyn-components = { path = "../../../packages/components", editable = true }
phasyn-media = { path = "../../../packages/media", editable = true }
phasyn-wan-native = { path = "../../../runtimes/wan-native", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post2/flash_attn-2.8.3.post2%2Bcu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
SAM-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }

[[tool.uv.dependency-metadata]]
name = "sam-2"
version = "1.0"
requires-python = ">=3.10"
requires-dist = ["torch>=2.5.1", "torchvision>=0.20.1", "numpy>=1.24.4", "tqdm>=4.66.1", "hydra-core>=1.3.2", "iopath>=0.1.10", "pillow>=9.4.0"]

[tool.uv.extra-build-dependencies]
sam-2 = [{ requirement = "torch", match-runtime = true }, "setuptools"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
