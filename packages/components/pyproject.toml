[project]
name = "phasyn-components"
version = "1.0.0"
description = "Phasyn Studio core: wire contracts, settings, the Recorder SDK, files, the component process protocol and CPU providers (no torch)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Phasyn Studio authors" }]
dependencies = [
    "jsonschema>=4.26",
    "referencing>=0.37",
]

[project.urls]
Homepage = "https://github.com/phasyn/phasyn-studio"
Repository = "https://github.com/phasyn/phasyn-studio"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phasyn_components"]

# The wire contracts live at the repository root; hatch_build.py packages them as
# phasyn_components/_contracts in the sdist and the wheel (also when the wheel is built from the sdist).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
