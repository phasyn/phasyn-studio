[package]
name = "phasyn-editor-kernel"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "Apache-2.0"
description = "Pure waveform peak aggregation for the local editor"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
