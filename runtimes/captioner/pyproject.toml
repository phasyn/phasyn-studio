[project]
name = "phasyn-captioner"
version = "1.0.0"
description = "Video providers for Phasyn Studio that run in the H3 GPU environments: qwen_vl.describe (video understanding through Qwen-VL text generation, separate from the H3 text-encoder feature tap) and media.upscale (Anime4K v4 VL super-resolution with an optional Restore_CNN_Soft_VL pass, MIT shaders vendored)"
requires-python = ">=3.12"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "src/phasyn_captioner/upscale/third_party/anime4k/LICENSE"]
authors = [{ name = "Phasyn Studio authors" }]
# torch and transformers come from the GPU runtime environment; describe() reports what is missing.
# numpy is already a dependency of phasyn-media.
dependencies = ["phasyn-components", "phasyn-media"]

[project.urls]
Homepage = "https://github.com/phasyn/phasyn-studio"
Repository = "https://github.com/phasyn/phasyn-studio"

[project.entry-points."phasyn.providers"]
"qwen_vl.describe" = "phasyn_captioner.provider:QwenVLDescribeProvider"
"media.upscale" = "phasyn_captioner.upscale.provider:UpscaleProvider"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phasyn_captioner"]
