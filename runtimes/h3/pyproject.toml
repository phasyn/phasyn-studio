[project]
name = "phasyn-h3"
version = "1.0.0"
description = "MiniMax H3 component providers for Phasyn Studio (conditioning, reference encode, DiT, video/audio decode) over the pinned SGLang numeric recipe"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Phasyn Studio authors" }]
# Only torch-free dependencies. torch, SGLang and the rest of the numeric stack come from the GPU runtime
# environment (deploy/runtimes/<tuple>); describe() reports what is missing (PROVIDER_NOT_INSTALLED).
dependencies = [
    "phasyn-components",
    "phasyn-media",
    "jsonschema>=4.26",
    "referencing>=0.37",
    "numpy>=1.26",
]

[project.entry-points."phasyn.providers"]
"h3.conditioning" = "phasyn_h3.providers:ConditioningProvider"
"h3.reference" = "phasyn_h3.providers:ReferenceProvider"
"h3.video_encode" = "phasyn_h3.providers:VideoEncodeProvider"
"h3.audio_encode" = "phasyn_h3.providers:AudioEncodeProvider"
"h3.dit" = "phasyn_h3.providers:DitProvider"
"h3.video_decode" = "phasyn_h3.providers:VideoDecodeProvider"
"h3.audio_decode" = "phasyn_h3.providers:AudioDecodeProvider"
"h3.lora_train" = "phasyn_h3.lora_train:LoraTrainProvider"

[project.scripts]
# GPU runtime tools (run them with the tuple's interpreter, e.g. deploy/runtimes/x86_64/.venv/bin/…)
phasyn-h3-adaln-sidecar = "phasyn_h3.recipe.runtime.adaln_sidecar:main"
phasyn-h3-importcheck = "phasyn_h3.recipe.runtime.importcheck:main"

[project.urls]
Homepage = "https://github.com/phasyn/phasyn-studio"
Repository = "https://github.com/phasyn/phasyn-studio"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phasyn_h3"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = [".rewrite", "build", "dist"]
force-exclude = true
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
[tool.ruff.lint]
select = [
    "E", "W", "F", "UP", "B", "SIM", "I", "N", "C90", "ARG", "S",
    "TID253", "T20", "RET", "ICN", "PIE", "PL", "TRY", "FLY", "PERF", "ANN", "D",
    "PGH", "RUF", "ASYNC", "BLE", "C4", "DTZ", "EXE", "FA", "FURB", "G",
    "INT", "LOG", "PTH", "PYI", "T10", "YTT", "ISC004", "TC004", "TC005",
    "TC007", "TC010", "FAST", "A", "FBT", "NPY",
]
ignore = [
    "E501", "TRY003", "PERF203", "ANN204", "ANN401",
    "W191", "E111", "E114", "E117", "D206", "D300",
]
# Full-width punctuation that Traditional Chinese text uses (RUF001-RUF003).
allowed-confusables = ["／", "×", "\uFF0C", "\uFF1A", "\uFF1B", "\uFF01", "\uFF1F", "\uFF08", "\uFF09"]
# Cold provider discovery must work without a CUDA environment or any model libraries.
[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["torch", "sglang", "triton", "safetensors", "pynvml", "PIL"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "PLR2004"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
strict_equality_for_none = true
show_error_codes = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "redundant-self", "truthy-bool",
    "truthy-iterable", "possibly-undefined", "unused-awaitable", "deprecated",
    "explicit-override", "mutable-override", "exhaustive-match", "unimported-reveal",
]
