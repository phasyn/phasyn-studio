[project]
name = "phasyn-qimg"
version = "1.0.0"
description = "Qwen-Image 2.1 component providers for Phasyn Studio (prepare, Qwen3-VL conditioning, VAE encode/decode, DiT, compose, image reverse prompting); heavy libraries are imported lazily in load/invoke"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Phasyn Studio authors" }]
# Only torch-free dependencies. torch, diffusers, transformers and Pillow come from the GPU runtime environment
# (deploy/runtimes/qimg-x86_64; aarch64-sm121 serves qimg.vision); describe() reports missing modules
# (PROVIDER_NOT_INSTALLED) instead of failing at import time.
dependencies = ["phasyn-components", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/phasyn/phasyn-studio"
Repository = "https://github.com/phasyn/phasyn-studio"

[project.entry-points."phasyn.providers"]
"qimg.prepare" = "phasyn_qimg.prepare:PrepareProvider"
"qimg.conditioning" = "phasyn_qimg.conditioning:ConditioningProvider"
"qimg.vae_encode" = "phasyn_qimg.vae:VaeEncodeProvider"
"qimg.vae_decode" = "phasyn_qimg.vae:VaeDecodeProvider"
"qimg.dit" = "phasyn_qimg.dit.provider:QimgDitProvider"
"image.compose" = "phasyn_qimg.compose:ComposeProvider"
"qimg.vision" = "phasyn_qimg.vision.provider:QwenVisionProvider"
"prompt.scene_compile" = "phasyn_qimg.prompting.provider:SceneCompileProvider"
"prompt.scene_score" = "phasyn_qimg.prompting.provider:SceneScoreProvider"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phasyn_qimg"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = [".rewrite", "build", "dist"]
force-exclude = true
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
[tool.ruff.lint]
select = [
    "E", "W", "F", "UP", "B", "SIM", "I", "N", "C90", "ARG", "S",
    "T20", "RET", "ICN", "PIE", "PL", "TRY", "FLY", "PERF", "ANN", "D",
    "TID253", "PGH", "RUF", "ASYNC", "BLE", "C4", "DTZ", "EXE", "FA", "FURB", "G",
    "INT", "LOG", "PTH", "PYI", "T10", "YTT", "ISC004", "TC004", "TC005",
    "TC007", "TC010", "FAST", "A", "FBT", "NPY",
]
ignore = [
    "E501", "TRY003", "PERF203", "ANN204", "ANN401",
    "W191", "E111", "E114", "E117", "D206", "D300",
]
# Full-width punctuation that Traditional Chinese text uses (RUF001-RUF003).
allowed-confusables = ["／", "×", "\uFF0C", "\uFF1A", "\uFF1B", "\uFF01", "\uFF1F", "\uFF08", "\uFF09"]
[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
lines-after-imports = 2
[tool.ruff.lint.pydocstyle]
convention = "google"
[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "PLR2004"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
strict_equality_for_none = true
show_error_codes = true
enable_error_code = [
    "ignore-without-code", "redundant-expr", "redundant-self", "truthy-bool",
    "truthy-iterable", "possibly-undefined", "unused-awaitable", "deprecated",
    "explicit-override", "mutable-override", "exhaustive-match", "unimported-reveal",
]

[tool.ruff.lint.flake8-tidy-imports]
# Provider discovery runs on the host without these optional model and image runtimes.
banned-module-level-imports = ["torch", "diffusers", "transformers", "PIL", "accelerate", "gguf", "safetensors", "phasyn_components.recorder.gpu"]
